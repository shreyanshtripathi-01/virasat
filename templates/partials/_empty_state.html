<div class="surface-card empty-state">
  <div class="empty-illustration" aria-hidden="true">
    <svg viewBox="0 0 160 120" role="img" focusable="false">
      <rect x="8" y="8" width="144" height="104" rx="18" fill="#F3E5D1"></rect>
      <path d="M24 82c18-20 36-30 56-30s38 10 56 30" fill="none" stroke="#B5482A" stroke-width="3" stroke-linecap="round"></path>
      <path d="M52 52c0-14 12-25 28-25s28 11 28 25" fill="none" stroke="#1F2A56" stroke-width="4" stroke-linecap="round"></path>
      <circle cx="80" cy="58" r="7" fill="#E3A018"></circle>
      <path d="M38 26l5 9 10 1-7 7 2 10-10-5-9 5 2-10-8-7 10-1z" fill="#3E7C4F" opacity=".8"></path>
      <path d="M122 78l4 7 8 1-6 6 2 8-8-4-7 4 1-8-6-6 8-1z" fill="#B5482A" opacity=".7"></path>
    </svg>
  </div>
  <h2>{{ title|default:"Nothing here yet" }}</h2>
  <p>{{ message|default:"There is nothing to show here right now." }}</p>
  {% if action_url %}<a class="btn btn-brand" href="{{ action_url }}">{{ action_label|default:"Continue" }}</a>{% endif %}
  {% if secondary_url %}<a class="btn btn-ghost" href="{{ secondary_url }}">{{ secondary_label|default:"Learn more" }}</a>{% endif %}
</div>
