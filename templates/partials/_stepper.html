<ol class="stepper" aria-label="Progress">
  <li class="stepper__step {% if current > 1 %}is-done{% elif current == 1 %}is-current{% endif %}" {% if current == 1 %}aria-current="step"{% endif %}>
    <span class="stepper__circle">{% if current > 1 %}<i class="bi bi-check-lg" aria-hidden="true"></i>{% else %}1{% endif %}</span>
    <span>{{ step_one|default:"Describe" }}</span>
  </li>
  <li class="stepper__step {% if current > 2 %}is-done{% elif current == 2 %}is-current{% endif %}" {% if current == 2 %}aria-current="step"{% endif %}>
    <span class="stepper__circle">{% if current > 2 %}<i class="bi bi-check-lg" aria-hidden="true"></i>{% else %}2{% endif %}</span>
    <span>{{ step_two|default:"Review" }}</span>
  </li>
  <li class="stepper__step {% if current == 3 %}is-current{% endif %}" {% if current == 3 %}aria-current="step"{% endif %}>
    <span class="stepper__circle">3</span>
    <span>{{ step_three|default:"Publish" }}</span>
  </li>
</ol>
