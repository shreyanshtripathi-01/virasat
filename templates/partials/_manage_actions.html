<div class="management-actions">
  <a class="btn btn-outline-brand btn-sm" href="{% url 'catalog:product_edit' product.pk %}">Edit</a>
  <a class="btn btn-ghost btn-sm" href="{{ product.get_absolute_url }}">Preview</a>
  {% if product.status == "published" %}
    <form method="post" action="{% url 'catalog:product_status' product.pk %}">{% csrf_token %}<input type="hidden" name="status" value="archived"><button class="btn btn-outline-brand btn-sm" type="submit">Archive</button></form>
  {% else %}
    <a class="btn btn-ghost btn-sm" href="{% url 'catalog:product_edit' product.pk %}#publish-confirmation">Review and publish</a>
  {% endif %}
  <a class="btn btn-ghost btn-sm text-danger" href="{% url 'catalog:product_delete' product.pk %}">Delete</a>
</div>
